url: https://github.com/Garybot126/dsh-subagent-models
name: Garybot126/dsh-subagent-models
category: model
description:
  en: "Set the provider, model and reasoning effort delegated subagents run with, from one place: Settings → 子代理. Applied on the agent/request hook to every in-process child, without editing agent presets or the subagent tool schema, effective on the child's next request; the composer shows a read-only badge with the value that will actually be used."
  zh: 在一个地方（设置 › 子代理）统一指定委派子代理使用的 provider、模型与思考强度；在 agent/request 钩子上对每个进程内子代理生效，不改 agent preset、不改 subagent 工具 schema，子代理下一次请求即生效；输入框旁以只读徽标显示真正会用的值。
